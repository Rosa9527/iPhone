<!DOCTYPE html>
<!-- 本地视觉测试台：模拟宿主深色聊天背景，直接加载本扩展的 style.css + index.js。
     用法：test.html            → 只出现悬浮球
           test.html?open=1     → 自动打开手机界面
           test.html?app=qq     → 自动打开手机并进入 QQ 占位页
           test.html?app=settings → 自动打开手机并进入设置页
           test.html?app=settings&api=1 → 再推入「API 连接」子页
           test.html?app=qq&menu=1 → 弹出消息页右上角「+」菜单
           test.html?app=qq&addfriend=1 / &addgroup=1 → 直达添加好友 / 创建群聊表单
           test.html?app=wechat → 自动打开手机并进入微信
           test.html?app=wechat&wxtab=contacts|discover|me → 直达微信对应 Tab
           test.html?app=wechat&wxchat=N → 进微信后点开第 N 个会话（1 起）
           test.html?app=wechat&wxprofile=1 / &wxavatar=1 → 编辑资料页 / 选择头像浮层
           test.html?app=wechat&wxmenu=1 / &wxaddfriend=1 / &wxaddgroup=1 → 加号菜单 / 添加朋友 / 发起群聊
           test.html?app=wechat&wxgprof=1（配合 &wxchat=N）→ 群聊资料页
           test.html?app=wechat&wxfprof=1（配合 &wxchat=N）→ 联系人资料页
           test.html?app=wechat&wxvmoments=1（配合 &wxchat=N）→ 经资料页直达 TA 的朋友圈
           test.html?app=wechat&wxmoments=1 → 直达朋友圈动态流（全局）
           test.html?app=wechat&wxservice=1 → 切「我」Tab 后点「服务」行，进服务页
           test.html?app=wechat&wxwallet=1（配合 &wxservice=1）→ 再点「钱包」行进钱包页
           test.html?app=wechat&wxchange=1（配合 &wxservice=1&wxwallet=1）→ 再点「零钱」行进零钱页
           test.html?app=qq&fqzone=1（配合 &chat=N）→ 经好友资料页直达她的QQ空间
           test.html?app=settings&wxpreset=1 → 再推入「微信私聊提示词」子页
           test.html?app=settings&wxassesspreset=1 → 再推入「零钱评估提示词」子页
           test.html?app=xhs → 自动打开手机并进入小红书
           test.html?app=xhs&xhstab=market|messages|me → 直达小红书对应 Tab
           test.html?app=xhs&xhsnote=N → 进小红书后点开首页信息流第 N 篇笔记（1 起）
           test.html?app=xhs&xhsprofile=1 / &xhsavatar=1 → 编辑资料页 / 选择头像浮层
           test.html?app=xhs&xhscompose=1 → 发布笔记页
           test.html?app=xhs&xhsinbox=likes|follows|comments → 消息页的聚合子页
           test.html?app=settings&xhspreset=1 → 再推入「小红书提示词」子页
           test.html?app=taobao → 自动打开手机并进入淘宝
           test.html?app=taobao&tbtab=category|messages|cart|me → 直达淘宝对应 Tab
           test.html?app=taobao&tbproduct=N → 进淘宝后点开首页第 N 个商品（1 起）
           test.html?app=taobao&tbsearch=关键词 → 直达搜索页并直接搜这个词
           test.html?app=taobao&tbsearch=1 → 直达搜索页空态（热搜榜 / 搜索历史）
           test.html?app=taobao&tborders=all|paid|shipped|review|afterSale|star|history
                                              → 直达「我的淘宝」的订单 / 收藏子页
           test.html?app=settings&taobaopreset=1 → 再推入「淘宝提示词」子页
           test.html?app=settings&inject=1 → 再推入「第三方注入」子页（配 &st=1
                                              时先模拟一次捕获，列表里就有内容；
                                              每条前的勾选框勾中 = 该条不附带）
           test.html?seed=1 → 注入演示小红书数据（网友 / 笔记 / 评论 / 私密笔记）与
                             淘宝数据（商品 / 购物车 / 订单），本地测试台没有 AI，
                             配合 ?app=xhs / ?app=taobao 才有的看
           任意 URL 加 &st=1 → 安装模拟宿主上下文（酒馆聊天楼层 + 设置持久化，
           镜像到 localStorage 的 iPhone_mock_host），用于 iPhone_Message 楼层同步测试；
           ?st=1 下控制台可调 __iPhoneMockInject() 模拟第三方注入并触发捕获，
           另有 __iPhoneMockPersistent() / __iPhoneMockSendTimeEnd() 单独模拟两条取材
           路径（常驻注入的实时读 / 发送期注入被清空后靠快照补齐） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone 扩展 · 本地测试台</title>
<link rel="stylesheet" href="style.css?v=1.0.0">
<style>
  /* 与宿主对齐的全局重置：酒馆的 style.css 里有 `* { box-sizing: border-box }`，
     而插件是按这个前提写的（多处以「固定 px 尺寸 + padding」排版，见 README
     设计要点）。测试台缺了这条，整机边框会被 padding 撑大 24px、与真机不符，
     因此这里显式补上——测试台的观感必须与宿主一致，否则本地看不出真实问题。 */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #1f2233 0%, #171a26 100%);
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #cfd3e0;
  }
  .fake-chat { max-width: 720px; margin: 0 auto; padding: 48px 24px; display: flex; flex-direction: column; gap: 18px; }
  .bubble { max-width: 70%; padding: 12px 16px; border-radius: 14px; line-height: 1.7; font-size: 14px; }
  .bubble--ai { align-self: flex-start; background: #2a2e42; border-top-left-radius: 4px; }
  .bubble--user { align-self: flex-end; background: #3b5bd6; color: #fff; border-top-right-radius: 4px; }
</style>
</head>
<body>
  <div class="fake-chat">
    <div class="bubble bubble--ai">这里是模拟的宿主聊天背景，用来检查扩展浮层在真实界面上的观感。</div>
    <div class="bubble bubble--user">点击悬浮球打开手机～</div>
    <div class="bubble bubble--ai">遮罩、动画与状态栏都应显示在这层内容之上。</div>
  </div>
  <script>
    // ?st=1：模拟宿主上下文（须在 index.js 之前安装）。chat 楼层数组与
    // extensionSettings 一起镜像到 localStorage（iPhone_mock_host），跨刷新保持，
    // 用来端到端测试 iPhone_Message 楼层同步（新建 / 复用 / 追加）。测试脚本可经
    // globalThis.__iPhoneMockST 直接改 chat、读 __rendered / __updated / __saves 计数。
    if (new URLSearchParams(location.search).has('st')) {
      const MOCK_KEY = 'iPhone_mock_host';
      const loadMockState = () => {
        try {
          const parsed = JSON.parse(localStorage.getItem(MOCK_KEY) || 'null');
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch { return {}; }
      };
      const initial = loadMockState();
      const mockCtx = {
        name1: '测试用户',
        name2: '测试角色',
        chat: Array.isArray(initial.chat) ? initial.chat : [],
        extensionSettings: (initial.extensionSettings && typeof initial.extensionSettings === 'object')
          ? initial.extensionSettings : {},
        // chatMetadata（jsonl 首行）一并镜像：v0.15.0 起剧情数据（联系人 / 动态 /
        // 我的资料）都存 chatMetadata.IPhone，随「聊天文件」走，这里跨刷新保持。
        chatMetadata: (() => {
          const restored = (initial.chatMetadata && typeof initial.chatMetadata === 'object')
            ? initial.chatMetadata : {};
          return { world_info: [], ...restored };
        })(),
        addOneMessage: (mes) => { mockCtx.__rendered.push(JSON.parse(JSON.stringify(mes))); },
        updateMessageBlock: (index, mes) => { mockCtx.__updated.push({ index, mes: mes ? mes.mes : null }); },
        saveChat: () => { mockCtx.__saves += 1; persistMockState(); },
        saveSettingsDebounced: () => { persistMockState(); },
        saveSettings: () => { persistMockState(); },
        __rendered: [],
        __updated: [],
        __saves: 0,
      };
      const persistMockState = () => {
        try {
          localStorage.setItem(MOCK_KEY, JSON.stringify({
            chat: mockCtx.chat,
            extensionSettings: mockCtx.extensionSettings,
            chatMetadata: mockCtx.chatMetadata,
          }));
        } catch {}
      };
      // ---- 模拟宿主的世界书引擎（对齐 TauriTavern ctx 的最小接口） ----
      // 一本「测试世界书」：uid10 常驻（永远激活）、uid11 关键词触发（魔法/知世/
      // 秘密/歌）、uid12 禁用。loadWorldInfo 返回标准 ST 条目结构（disable 字段）。
      const MOCK_WORLDBOOK_NAME = '测试世界书';
      const MOCK_WORLDBOOK_ENTRIES = {
        10: { uid: 10, comment: '世界观·魔法', content: '世界设定：这是一个魔法与剑的世界，魔法由星辰之力驱动。', disable: false, constant: true, position: 0, key: ['魔法', '世界'] },
        11: { uid: 11, comment: '知世的秘密', content: '知世隐藏着一个关于歌声的秘密。', disable: false, constant: false, position: 1, key: ['知世', '秘密', '歌'] },
        12: { uid: 12, comment: '被禁用条目', content: '这段内容不该出现在任何提示词里。', disable: true, constant: false, position: 0, key: [] },
      };
      mockCtx.maxContext = 4096;
      mockCtx.characters = [{ name: '测试角色', data: { extensions: { world: MOCK_WORLDBOOK_NAME } } }];
      mockCtx.characterId = 0;
      mockCtx.powerUserSettings = { persona_description_lorebook: '' };
      mockCtx.getCharacterCardFields = () => ({
        personaDescription: '', characterDescription: '测试角色卡描述。', characterPersonality: '',
        characterDepthPrompt: '', scenario: '', creatorNotes: '',
      });
      mockCtx.loadWorldInfo = async (name) => (name === MOCK_WORLDBOOK_NAME
        ? { entries: JSON.parse(JSON.stringify(MOCK_WORLDBOOK_ENTRIES)) }
        : null);
      mockCtx.getWorldInfoPrompt = async (scanChat) => {
        const scanText = (scanChat || []).join('\n');
        const entries = [];
        for (const entry of Object.values(MOCK_WORLDBOOK_ENTRIES)) {
          if (entry.disable) continue;
          const hit = entry.constant
            || (entry.key || []).some((k) => scanText.includes(k));
          if (hit) {
            entries.push({ world: MOCK_WORLDBOOK_NAME, uid: entry.uid, content: entry.content, position: entry.position });
          }
        }
        return { worldInfoActivation: { entries }, worldInfoBefore: '', worldInfoAfter: '' };
      };
      // ---- 最小事件源（订阅 / 退订 / emit）：端到端测 CHAT_CHANGED 重建 ----
      const mockListeners = {};
      mockCtx.event_types = {
        CHAT_CHANGED: 'CHAT_CHANGED',
        // 提示词就绪事件（v0.26.0 起本插件用它捕获第三方注入）：mock 里用
        // __iPhoneMockInject() 手动触发，见下。
        CHAT_COMPLETION_PROMPT_READY: 'CHAT_COMPLETION_PROMPT_READY',
        GENERATE_AFTER_COMBINE_PROMPTS: 'GENERATE_AFTER_COMBINE_PROMPTS',
      };
      mockCtx.eventSource = {
        on: (type, fn) => { (mockListeners[type] || (mockListeners[type] = [])).push(fn); },
        removeListener: (type, fn) => {
          mockListeners[type] = (mockListeners[type] || []).filter((f) => f !== fn);
        },
        emit: (type, ...args) => {
          for (const fn of mockListeners[type] || []) {
            try { fn(...args); } catch {}
          }
        },
      };
      globalThis.__iPhoneMockST = mockCtx;
      globalThis.SillyTavern = { getContext: () => mockCtx };
      // ---- 第三方注入（v0.26.0）的测试替身 ----
      // 本插件不认识任何具体扩展，只读宿主自己的注入注册表 extension_prompts。
      // 这里就照两种真实扩展的写法往注册表里写，覆盖两条取材路径：
      //   常驻型（生物追踪、世界引擎）：注入长期留在注册表里，本插件实时读到；
      //   发送期（万华镜）：发送前写入、生成结束清空，只有「提示词就绪」那一刻的
      //   快照能看到——所以 mock 里写完之后要手动清一次来模拟生成结束。
      // 入口：
      //   __iPhoneMockInject()        常驻注入 + 发送期注入 + 触发捕获（完整一轮）
      //   __iPhoneMockInject(null)    清空注册表并触发捕获（模拟本轮没有任何注入）
      //   __iPhoneMockPersistent(text)  只改常驻那条（不动发送期）
      //   __iPhoneMockSendTimeEnd()   清掉发送期那条（模拟生成结束，只剩「上一轮」）
      // 实际附带内容用 iphoneInjectEffectiveEntries() 查看、快照用
      // iphoneInjectGetSnapshot()。写入用宿主同款结构：setExtensionPrompt 的
      // { value, position, depth, scan, role }。
      mockCtx.extensionPrompts = {};
      mockCtx.substituteParams = (text) => String(text)
        .replace(/\{\{user\}\}/g, '测试用户')
        .replace(/\{\{char\}\}/g, '测试角色');
      // 宿主 setExtensionPrompt 的最小复刻：真身在 script.js，扩展都是这么写的。
      mockCtx.setExtensionPrompt = (key, value, position = 0, depth = 0, scan = false, role = 0) => {
        mockCtx.extensionPrompts[key] = {
          value: String(value), position: Number(position), depth: Number(depth), scan: !!scan, role: Number(role ?? 0),
        };
      };
      const mockValuesText = (text) => text ?? ['<Values>', '【系统信息】本块不是剧情正文，是当前变量状态（YAML 格式）。', '', '好感度: 42', '当前章节: 第三章', '玩家名: {{user}}', '</Values>'].join('\n');
      const mockPersistentText = '<生物追踪>\n体力: 78/100\n发情: 12%\n</生物追踪>';
      // 两个键名照抄真实扩展（键名不影响本插件行为，只为看着像）：
      const PERSISTENT_KEY = 'bs_biotracker_mainflow'; // 常驻型
      const SENDTIME_KEY = 'Kaleidoscope_Values'; // 发送期
      globalThis.__iPhoneMockPersistent = (text) => {
        // 常驻型扩展：注入留在注册表里不清，本插件随时读得到（预览里标「实时」）。
        if (text === null) delete mockCtx.extensionPrompts[PERSISTENT_KEY];
        else mockCtx.setExtensionPrompt(PERSISTENT_KEY, text === undefined ? mockPersistentText : text, 1, 12, false, 0);
        return mockCtx.extensionPrompts;
      };
      globalThis.__iPhoneMockSendTimeEnd = () => {
        // 发送期扩展在生成结束时把那条清空（清空即取消注入），注册表里就没有实时值
        // 了——此时只能靠上一轮快照补上（预览里标「上一轮」）。
        if (mockCtx.extensionPrompts[SENDTIME_KEY]) mockCtx.extensionPrompts[SENDTIME_KEY].value = '';
        return mockCtx.extensionPrompts;
      };
      globalThis.__iPhoneMockInject = (text) => {
        if (text === null) {
          mockCtx.extensionPrompts = {};
        } else {
          // 四条：常驻型一条、发送期一条，加两条应被过滤的——酒馆核心的作者注槽
          // （世界书会并进来）与本插件自己的键（避免自吞）。
          globalThis.__iPhoneMockPersistent();
          mockCtx.setExtensionPrompt(SENDTIME_KEY, mockValuesText(text), 0, 0, false, 0);
          mockCtx.setExtensionPrompt('2_floating_prompt', '<世界书条目>\n（酒馆核心注入 + 世界书，不该被当成第三方带进手机请求）\n</世界书条目>', 1, 4, false, 0);
          mockCtx.setExtensionPrompt('iPhone_Message', '（本插件自己的注入，不该出现在第三方列表里）', 1, 5, false, 0);
        }
        mockCtx.eventSource.emit('CHAT_COMPLETION_PROMPT_READY', { chat: [], dryRun: false });
        return mockCtx.extensionPrompts;
      };
    }
  </script>

          if (params.get('tab') || params.has('qzone')) {
            // ?tab=contacts|dynamics 直达对应标签页；?qzone=1 再点开空间动态。
            const openTabWhenReady = (retries) => {
              const qq = document.querySelector('.iphone-qq');
              if (qq && typeof qq._switchQqTab === 'function') {
                const tab = params.get('tab');
                if (tab === 'contacts') qq._switchQqTab(1);
                if (tab === 'dynamics' || params.has('qzone')) qq._switchQqTab(2);
                if (params.has('qzone')) {
                  const dyn = document.querySelector('.iphone-qq__dyn2-row.is-click');
                  if (dyn) dyn.click();
                  else if (retries > 0) setTimeout(() => openTabWhenReady(retries - 1), 150);
                  return;
                }
              } else if (retries > 0) {
                setTimeout(() => openTabWhenReady(retries - 1), 150);
              }
            };
            setTimeout(() => openTabWhenReady(20), 1400);
          }
          /* ---------- 微信（v0.18.0）：与 QQ 平行的同一套深链 ---------- */
          if (params.get('wxtab')) {
            // ?wxtab=contacts|discover|me 直达微信对应 Tab。
            const wxtab = params.get('wxtab');
            const idx = wxtab === 'contacts' ? 1 : wxtab === 'discover' ? 2 : wxtab === 'me' ? 3 : 0;
            const openWxTabWhenReady = (retries) => {
              const wx = document.querySelector('.iphone-wx');
              if (wx && typeof wx._switchWechatTab === 'function') wx._switchWechatTab(idx);
              else if (retries > 0) setTimeout(() => openWxTabWhenReady(retries - 1), 150);
            };
            setTimeout(() => openWxTabWhenReady(20), 1400);
          }
          if (params.has('wxchat')) {
            // ?wxchat=N：进微信后点开第 N 个会话（1 起），直达聊天页；
            // &wxfprof=1 再点右上角菜单直达联系人资料页；
            // &wxvmoments=1 再点「她的朋友圈」行，直达 TA 的朋友圈（只显示 TA 的动态）。
            const openWxChatWhenReady = (retries) => {
              const item = document.querySelectorAll('.iphone-wx__chat')[Number(params.get('wxchat')) - 1];
              if (item) item.click();
              else if (retries > 0) setTimeout(() => openWxChatWhenReady(retries - 1), 150);
            };
            setTimeout(() => openWxChatWhenReady(20), 1200);
            if (params.has('wxgprof') || params.has('wxfprof') || params.has('wxvmoments')) {
              const openWxGprofWhenReady = (retries) => {
                const menu = document.querySelector('.iphone-wxc__menu');
                if (menu) menu.click();
                else if (retries > 0) setTimeout(() => openWxGprofWhenReady(retries - 1), 150);
              };
              setTimeout(() => openWxGprofWhenReady(30), 1400);
            }
            if (params.has('wxvmoments')) {
              const openWxVMomentsWhenReady = (retries) => {
                const row = [...document.querySelectorAll('.iphone-wx__prof-link')]
                  .find((el) => el.textContent.includes('朋友圈'));
                if (row) row.click();
                else if (retries > 0) setTimeout(() => openWxVMomentsWhenReady(retries - 1), 150);
              };
              setTimeout(() => openWxVMomentsWhenReady(30), 1800);
            }
          }
          if (params.has('wxprofile') || params.has('wxavatar')) {
            // ?wxprofile=1：切到「我」Tab 再点资料卡，直达编辑资料页；
            // ?wxavatar=1 再点头像卡，直达选择头像浮层。
            const openWxProfWhenReady = (retries) => {
              const wx = document.querySelector('.iphone-wx');
              if (wx && typeof wx._switchWechatTab === 'function') {
                wx._switchWechatTab(3);
                const card = document.querySelector('.iphone-wx__me-card');
                if (card) card.click();
                else if (retries > 0) setTimeout(() => openWxProfWhenReady(retries - 1), 150);
              } else if (retries > 0) {
                setTimeout(() => openWxProfWhenReady(retries - 1), 150);
              }
            };
            setTimeout(() => openWxProfWhenReady(20), 1300);
            if (params.has('wxavatar')) {
              const openWxPickWhenReady = (retries) => {
                const card = document.querySelector('.iphone-wx__prof-avcard');
                if (card) card.click();
                else if (retries > 0) setTimeout(() => openWxPickWhenReady(retries - 1), 150);
              };
              setTimeout(() => openWxPickWhenReady(20), 1700);
            }
          }
          if (params.has('wxmenu') || params.has('wxaddfriend') || params.has('wxaddgroup')) {
            // ?wxmenu=1：弹出微信右上角「+」菜单；&wxaddfriend=1 / &wxaddgroup=1
            // 再点对应菜单项，直达添加朋友 / 发起群聊表单。
            const act = params.has('wxaddgroup') ? 'group' : 'friend';
            const openWxAddWhenReady = (retries) => {
              const add = document.querySelector('.iphone-wx__add');
              if (!add) {
                if (retries > 0) setTimeout(() => openWxAddWhenReady(retries - 1), 150);
                return;
              }
              add.click();
              if (!params.has('wxmenu')) {
                const item = document.querySelector(`.iphone-wx__addmenu-item[data-act="${act}"]`);
                if (item) item.click();
                else if (retries > 0) setTimeout(() => openWxAddWhenReady(retries - 1), 150);
              }
            };
            setTimeout(() => openWxAddWhenReady(20), 1200);
          }
          if (params.has('wxmoments')) {
            // ?wxmoments=1：切到「发现」Tab 再点「朋友圈」，直达动态流。
            const openWxMomentsWhenReady = (retries) => {
              const wx = document.querySelector('.iphone-wx');
              if (wx && typeof wx._switchWechatTab === 'function') {
                wx._switchWechatTab(2);
                const row = document.querySelector('.iphone-wx__dsc-row.is-click');
                if (row) row.click();
                else if (retries > 0) setTimeout(() => openWxMomentsWhenReady(retries - 1), 150);
              } else if (retries > 0) {
                setTimeout(() => openWxMomentsWhenReady(retries - 1), 150);
              }
            };
            setTimeout(() => openWxMomentsWhenReady(20), 1400);
          }
          if (params.has('wxservice') || params.has('wxwallet') || params.has('wxchange')) {
            // ?wxservice=1：切到「我」Tab 再点「服务」行，直达服务页；
            // &wxwallet=1 再点顶部「钱包」行，直达钱包页（余额在那里）；
            // &wxchange=1 再点「零钱」行，直达零钱页（「评估」按钮在那里）。
            const openWxServiceWhenReady = (retries) => {
              const wx = document.querySelector('.iphone-wx');
              if (wx && typeof wx._switchWechatTab === 'function') {
                wx._switchWechatTab(3);
                const row = document.querySelector('.iphone-wx__me-row[data-act="service"]');
                if (row) row.click();
                else if (retries > 0) setTimeout(() => openWxServiceWhenReady(retries - 1), 150);
              } else if (retries > 0) {
                setTimeout(() => openWxServiceWhenReady(retries - 1), 150);
              }
            };
            setTimeout(() => openWxServiceWhenReady(20), 1300);
            if (params.has('wxwallet') || params.has('wxchange')) {
              const openWxWalletWhenReady = (retries) => {
                const row = document.querySelector('.iphone-wx__svc-herocell[data-act="wallet"]');
                if (row) row.click();
                else if (retries > 0) setTimeout(() => openWxWalletWhenReady(retries - 1), 150);
              };
              setTimeout(() => openWxWalletWhenReady(30), 1700);
            }
            if (params.has('wxchange')) {
              const openWxChangeWhenReady = (retries) => {
                const row = [...document.querySelectorAll('.iphone-wx__wal-row')]
                  .find((el) => el.textContent.includes('零钱'));
                if (row) row.click();
                else if (retries > 0) setTimeout(() => openWxChangeWhenReady(retries - 1), 150);
              };
              setTimeout(() => openWxChangeWhenReady(40), 2100);
            }
          }
          if (params.has('wxpreset')) {
            // ?app=settings&wxpreset=1：设置页里点「微信私聊提示词」行，直达该子页。
            const openWxPresetWhenReady = (retries) => {
              const row = [...document.querySelectorAll('.iphone-st__row')]
                .find((el) => el.textContent.includes('微信私聊提示词'));
              if (row) row.click();
              else if (retries > 0) setTimeout(() => openWxPresetWhenReady(retries - 1), 150);
            };
            setTimeout(() => openWxPresetWhenReady(20), 1300);
          }
          if (params.has('wxassesspreset')) {
            // ?app=settings&wxassesspreset=1：设置页里点「零钱评估提示词」行，直达该子页。
            const openWxAssessPresetWhenReady = (retries) => {
              const row = [...document.querySelectorAll('.iphone-st__row')]
                .find((el) => el.textContent.includes('零钱评估提示词'));
              if (row) row.click();
              else if (retries > 0) setTimeout(() => openWxAssessPresetWhenReady(retries - 1), 150);
            };
            setTimeout(() => openWxAssessPresetWhenReady(20), 1300);
          }
          /* ---------- 小红书（v0.26.0）：与微信平行的同一套深链 ---------- */
          // 主界面对象上的钩子由 buildXhsAppScreen 暴露（_switchXhsTab / _openXhsNote …），
          // 各覆盖层走同一套「轮询到就点」模式，避免与打开应用的防重入锁抢时序。
          const xhsScreen = () => document.querySelector('.iphone-xhs');
          if (params.get('xhstab')) {
            // ?xhstab=market|messages|me 直达小红书对应 Tab（发布是覆盖层，走 &xhscompose=1）。
            const name = params.get('xhstab');
            const idx = name === 'market' ? 1 : name === 'messages' ? 3 : name === 'me' ? 4 : 0;
            const openXhsTabWhenReady = (retries) => {
              const xhs = xhsScreen();
              if (xhs && typeof xhs._switchXhsTab === 'function') xhs._switchXhsTab(idx);
              else if (retries > 0) setTimeout(() => openXhsTabWhenReady(retries - 1), 150);
            };
            setTimeout(() => openXhsTabWhenReady(20), 1400);
          }
          if (params.has('xhsnote')) {
            // ?xhsnote=N：点开首页信息流第 N 篇笔记（与首页展示顺序一致）。
            const openXhsNoteWhenReady = (retries) => {
              const xhs = xhsScreen();
              if (xhs && typeof xhs._openXhsNote === 'function') {
                if (xhs._openXhsNote(Number(params.get('xhsnote')) || 1)) return;
              }
              if (retries > 0) setTimeout(() => openXhsNoteWhenReady(retries - 1), 150);
            };
            setTimeout(() => openXhsNoteWhenReady(20), 1500);
          }
          if (params.has('xhsprofile') || params.has('xhsavatar')) {
            // ?xhsprofile=1：切到「我」Tab 再点编辑资料；&xhsavatar=1 再点头像行，直达选择头像浮层。
            const openXhsProfWhenReady = (retries) => {
              const xhs = xhsScreen();
              if (xhs && typeof xhs._switchXhsTab === 'function') {
                xhs._switchXhsTab(4);
                xhs._openXhsProfile();
                if (params.has('xhsavatar')) {
                  const row = document.querySelector('.iphone-xhs__prof-row--avatar');
                  if (row) row.click();
                  else if (retries > 0) setTimeout(() => openXhsProfWhenReady(retries - 1), 150);
                }
                return;
              }
              if (retries > 0) setTimeout(() => openXhsProfWhenReady(retries - 1), 150);
            };
            setTimeout(() => openXhsProfWhenReady(20), 1400);
          }
          if (params.has('xhscompose')) {
            // ?xhscompose=1：直达发布笔记页。
            const openXhsComposeWhenReady = (retries) => {
              const xhs = xhsScreen();
              if (xhs && typeof xhs._openXhsCompose === 'function') xhs._openXhsCompose();
              else if (retries > 0) setTimeout(() => openXhsComposeWhenReady(retries - 1), 150);
            };
            setTimeout(() => openXhsComposeWhenReady(20), 1400);
          }
          if (params.has('xhsinbox')) {
            // ?xhsinbox=likes|follows|comments：先切「消息」Tab，再进对应聚合子页。
            const openXhsInboxWhenReady = (retries) => {
              const xhs = xhsScreen();
              if (xhs && typeof xhs._switchXhsTab === 'function') {
                xhs._switchXhsTab(3);
                xhs._openXhsInbox(params.get('xhsinbox'));
                return;
              }
              if (retries > 0) setTimeout(() => openXhsInboxWhenReady(retries - 1), 150);
            };
            setTimeout(() => openXhsInboxWhenReady(20), 1400);
          }
          if (params.has('xhspreset')) {
            // ?app=settings&xhspreset=1：设置页里点「小红书提示词」行，直达该子页。
            const openXhsPresetWhenReady = (retries) => {
              const row = [...document.querySelectorAll('.iphone-st__row')]
                .find((el) => el.textContent.includes('小红书提示词'));
              if (row) row.click();
              else if (retries > 0) setTimeout(() => openXhsPresetWhenReady(retries - 1), 150);
            };
            setTimeout(() => openXhsPresetWhenReady(20), 1300);
          }
          /* ---------- 淘宝（v0.28.0）：与小红书平行的同一套深链 ---------- */
          // 主界面对象上的钩子由 buildTaobaoAppScreen 暴露（_switchTaobaoTab /
          // _openTaobaoProduct / _openTaobaoSearch / _openTaobaoOrders）。
          const tbScreen = () => document.querySelector('.iphone-tb');
          if (params.get('tbtab')) {
            // ?tbtab=category|messages|cart|me 直达淘宝对应 Tab（首页是默认）。
            const name = params.get('tbtab');
            const idx = name === 'category' ? 1 : name === 'messages' ? 2 : name === 'cart' ? 3 : name === 'me' ? 4 : 0;
            const openTbTabWhenReady = (retries) => {
              const tb = tbScreen();
              if (tb && typeof tb._switchTaobaoTab === 'function') tb._switchTaobaoTab(idx);
              else if (retries > 0) setTimeout(() => openTbTabWhenReady(retries - 1), 150);
            };
            setTimeout(() => openTbTabWhenReady(20), 1400);
          }
          if (params.has('tbproduct')) {
            // ?tbproduct=N：点开首页第 N 个商品（与首页展示顺序一致）。
            const openTbProductWhenReady = (retries) => {
              const tb = tbScreen();
              if (tb && typeof tb._openTaobaoProduct === 'function') {
                if (tb._openTaobaoProduct(Number(params.get('tbproduct')) || 1)) return;
              }
              if (retries > 0) setTimeout(() => openTbProductWhenReady(retries - 1), 150);
            };
            setTimeout(() => openTbProductWhenReady(20), 1500);
          }
          if (params.has('tbsearch')) {
            // ?tbsearch=关键词 直达搜索页并直接搜这个词；&tbsearch=1（无词）只看
            // 搜索页空态（热搜榜 / 搜索历史）——本地没有 AI，真点搜索会失败。
            const word = params.get('tbsearch');
            const openTbSearchWhenReady = (retries) => {
              const tb = tbScreen();
              if (tb && typeof tb._openTaobaoSearch === 'function') {
                tb._openTaobaoSearch(word && word !== '1' ? word : '');
                return;
              }
              if (retries > 0) setTimeout(() => openTbSearchWhenReady(retries - 1), 150);
            };
            setTimeout(() => openTbSearchWhenReady(20), 1500);
          }
          if (params.has('tborders')) {
            // ?tborders=all|paid|shipped|review|afterSale|star|history：先切「我的淘宝」，
            // 再进订单列表子页（收藏 / 足迹也在这个子页里换数据源）。
            const openTbOrdersWhenReady = (retries) => {
              const tb = tbScreen();
              if (tb && typeof tb._switchTaobaoTab === 'function') {
                tb._switchTaobaoTab(4);
                tb._openTaobaoOrders(params.get('tborders') || 'all');
                return;
              }
              if (retries > 0) setTimeout(() => openTbOrdersWhenReady(retries - 1), 150);
            };
            setTimeout(() => openTbOrdersWhenReady(20), 1400);
          }
          if (params.has('taobaopreset')) {
            // ?app=settings&taobaopreset=1：设置页里点「淘宝提示词」行，直达该子页。
            const openTbPresetWhenReady = (retries) => {
              const row = [...document.querySelectorAll('.iphone-st__row')]
                .find((el) => el.textContent.includes('淘宝提示词'));
              if (row) row.click();
              else if (retries > 0) setTimeout(() => openTbPresetWhenReady(retries - 1), 150);
            };
            setTimeout(() => openTbPresetWhenReady(20), 1300);
          }
          if (params.has('inject')) {
            // ?app=settings&inject=1：设置页里点「第三方注入」行，直达该子页。
            // 配 ?st=1 时先模拟一次捕获，预览列表里就有内容可看。
            const openInjectWhenReady = (retries) => {
              const row = [...document.querySelectorAll('.iphone-st__row')]
                .find((el) => el.textContent.includes('第三方注入'));
              if (row) row.click();
              else if (retries > 0) setTimeout(() => openInjectWhenReady(retries - 1), 150);
            };
            if (typeof globalThis.__iPhoneMockInject === 'function') {
              // 先跑完整一轮（两条注入都在 + 触发捕获），再把发送期那条清掉，模拟
              // 「生成已结束」——预览里就能同时看到「实时」与「上一轮」两种标注。
              globalThis.__iPhoneMockInject();
              globalThis.__iPhoneMockSendTimeEnd();
            }
            setTimeout(() => openInjectWhenReady(20), 1300);
          }
        }
      }, 300);
    }
  </script>
</body>
</html>
